name: Publish to Official MCP Registry

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for GitHub Actions OIDC authentication (/v0.1/auth/github-oidc)

jobs:
  publish:
    name: Publish MCP Server to Official Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Install mcp-publisher CLI
        run: |
          curl -sSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin mcp-publisher
          sudo chmod +x /usr/local/bin/mcp-publisher
          mcp-publisher --version || mcp-publisher --help

      - name: Authenticate via GitHub Actions OIDC
        run: mcp-publisher login github-oidc

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Publish to Official Registry
        run: mcp-publisher publish
